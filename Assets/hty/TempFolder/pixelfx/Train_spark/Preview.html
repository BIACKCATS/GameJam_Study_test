<!doctype html><meta charset="utf-8"><title>Rail Metal Sparks — 30fps</title><style>body{background:#12151e;color:#f5e6bc;font:16px system-ui;text-align:center}#sprite{width:128px;height:96px;background-image:url('Exports/impacts/rail-metal-sparks/rail-metal-sparks.png');image-rendering:pixelated;transform:scale(4);transform-origin:top left}#stage{width:512px;height:384px;margin:40px auto;background:#222838}button{padding:10px 24px}</style><h1>Metal friction sparks</h1><p>10 frames · 30 fps · transparent PNG · one shot</p><div id="stage"><div id="sprite"></div></div><button onclick="play()">다시 재생</button><script>let start=0;function play(){start=performance.now();requestAnimationFrame(tick)}function tick(t){let n=Math.min(9,Math.floor((t-start)*30/1000));document.querySelector('#sprite').style.backgroundPosition=`${-(n%3)*128}px ${-Math.floor(n/3)*96}px`;if(n<9)requestAnimationFrame(tick)}play()</script>
