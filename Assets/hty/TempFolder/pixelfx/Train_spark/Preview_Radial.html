<!doctype html><meta charset="utf-8"><title>Radial Metal Sparks</title><style>body{background:#12151e;color:#f5e6bc;font:16px system-ui;text-align:center}#sprite{width:128px;height:128px;background-image:url('Exports/impacts/rail-metal-radial/rail-metal-radial.png');image-rendering:pixelated;transform:scale(4);transform-origin:top left}#stage{width:512px;height:512px;margin:24px auto;background:#222838}button{padding:10px 24px}</style><h1>원형 금속 스파크</h1><p>10 frames · 30 fps · 360° burst · transparent PNG</p><div id="stage"><div id="sprite"></div></div><button onclick="play()">1회 재생</button><label><input id="repeat" type="checkbox" checked>미리보기 반복 (게임은 Loop OFF)</label><script>let handle,start;function play(){cancelAnimationFrame(handle);start=performance.now();handle=requestAnimationFrame(tick)}function tick(t){let elapsed=t-start,n=Math.min(9,Math.floor(elapsed*30/1000));document.querySelector('#sprite').style.backgroundPosition=`${-(n%4)*128}px ${-Math.floor(n/4)*128}px`;if(elapsed<334||document.querySelector('#repeat').checked){if(elapsed>1100)start=t;handle=requestAnimationFrame(tick)}}play()</script>
