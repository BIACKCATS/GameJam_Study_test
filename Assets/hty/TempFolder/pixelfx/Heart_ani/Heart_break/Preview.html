<!doctype html><meta charset="utf-8"><title>Heart break — canonical red heart</title><style>body{background:#191c29;color:#fff;font:16px system-ui;text-align:center}.row{display:flex;justify-content:center;gap:48px;flex-wrap:wrap}.stage{width:288px;height:288px;background:repeating-conic-gradient(#303442 0 25%,#252936 0 50%) 0/24px 24px}.sprite{width:48px;height:48px;transform:scale(6);transform-origin:top left;image-rendering:pixelated}#anim{background-image:url('Exports/heart-break.png')}#base{background-image:url('../HeartShimmer/Exports/heart-base.png')}button{margin:20px;padding:10px 20px}</style><h1>같은 하트의 파손과 소멸</h1><p>10 frames · 12fps · one shot · transparent PNG</p><div class="row"><div><h2>기준 하트</h2><div class="stage"><div class="sprite" id="base"></div></div></div><div><h2>파손</h2><div class="stage"><div class="sprite" id="anim"></div></div></div></div><button onclick="play()">다시 1회 재생</button><p>좌측은 기준 원본입니다. 우측은 소멸 후 투명한 상태로 정지합니다.</p><script>let handle,start;function play(){cancelAnimationFrame(handle);start=performance.now();handle=requestAnimationFrame(tick)}function tick(t){let n=Math.min(9,Math.floor((t-start)*12/1000));document.querySelector('#anim').style.backgroundPosition=`${-(n%4)*48}px ${-Math.floor(n/4)*48}px`;if(n<9)handle=requestAnimationFrame(tick)}play()</script>
