<!doctype html><meta charset="utf-8"><title>Red heart shimmer</title><style>body{background:#191c29;color:#fff;font:16px system-ui;text-align:center}.row{display:flex;justify-content:center;gap:48px;flex-wrap:wrap}.stage{width:288px;height:288px;background:repeating-conic-gradient(#303442 0 25%,#252936 0 50%) 0/24px 24px}.sprite{width:48px;height:48px;transform:scale(6);transform-origin:top left;image-rendering:pixelated}#anim{background-image:url('Exports/heart-shimmer.png')}#base{background-image:url('Exports/heart-base.png')}button{margin:20px;padding:10px 20px}</style><h1>빨간 하트 반짝임</h1><p>48×48 · 10 frames · 10fps · 1 second loop</p><div class="row"><div><h2>기준 원본</h2><div class="stage"><div class="sprite" id="base"></div></div></div><div><h2>반짝임</h2><div class="stage"><div class="sprite" id="anim"></div></div></div></div><button onclick="paused=!paused;this.textContent=paused?'재생':'일시정지'">일시정지</button><p>체커보드는 미리보기용입니다. PNG 배경은 투명합니다.</p><script>let paused=false,clock=0,last=performance.now();function tick(t){if(!paused)clock+=t-last;last=t;let n=Math.floor(clock/100)%10;document.querySelector('#anim').style.backgroundPosition=`${-(n%4)*48}px ${-Math.floor(n/4)*48}px`;requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
